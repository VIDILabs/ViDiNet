<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ViDiNet</title>

    <link href="http://fonts.googleapis.com/css?family=VT323" rel='stylesheet' type='text/css'/>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <link href='http://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=VT323"/>
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet"
          integrity="sha384-T8Gy5hrqNKT+hzMclPo118YTQO6cYprQmhrYwIiQ/3axmI1hQomh7Ud2hPOy8SP1"
          crossorigin="anonymous">

    <style>
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        * {
            font-family: 'VT323', sans-serif;
        }

        #loading {
            position: absolute;
            width: 100%;
            top: 45%;
            text-align: center;
        }

        #serverLog {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            overflow: auto;
        }

        .expressApp {
            display: flex !important;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .expressAppHide {
            flex: 0 1;
            width: 0;
            height: 0;
        }

        .localDemo {
            display: flex !important;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .localDemoHide {
            flex: 0 1;
            width: 0;
            height: 0;
        }
    </style>
</head>

<body>
<div id="loading">
    <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
</div>
<div id="serverLog"></div>
<webview id="expressApp" class="expressApp"></webview>
<webview id="localDemo" class="localDemo localDemoHide" src="http://localhost:3000/"></webview>

<script>
    window.$ = window.jQuery = require("./node_modules/jquery/dist/jquery.min.js");
    const electron = require("electron");

    // 'darwin' for mac
    // 'win32' for windows (doesn't matter the architecture)
    console.log(process.platform);

    const expressAppUrl = "http://127.0.0.1:3030",
        spawn = require("child_process").spawn,
        // For electron-packager change cwd in spawn to app.getAppPath() and
        // uncomment the app require below
        //app = require('electron').remote.app,
        request = require("request"),
        _ = require("lodash"),
        key = require("keymaster"),
        $serverLog = $("#serverLog"),
        $expressApp = $("#expressApp"),
        $localDemo = $("#localDemo"),
        $loading = $("#loading");

    if (process.platform === 'darwin') {
        //OSX

        const darwin_node = spawn("node", ["./express-app/bin/www"], {
            cwd: process.cwd(),
            stdio: [null, null, null, 'ipc']
        });

        //receives messages from the express-application, these messages are explicitly to open a demo
        darwin_node.on('message', function (data) {
            //Data in this case should be the script name that needs to be opened.
            var response = data.split("::");

            //If running a script, check if script is already running
            if (response.length > 1) {
                var filename = response[0],
                path = response[1];

                script = require("child_process").exec(filename, {cwd: path },
                    function (error, stdout, stderr) {
                        console.log('stdout: ' + stdout);
                        console.log('stderr: ' + stderr);
                        if (error !== null) {
                            console.log('exec error: ' + error);
                        }
                    });

            }

        });

        redirectOutput(darwin_node.stdout);
        redirectOutput(darwin_node.stderr);
    } else if (process.platform === 'win32') {
        //WINDOWS

        const win_node = spawn(".\\node.exe", ["./express-app/bin/www"], {cwd: process.cwd(),  stdio: [null, null, null, 'ipc']});

        //receives messages from the express-application, these messages are explicitly to open a demo
        win_node.on('message', function (data) {
            //Data in this case should be the script name :: path.
            var response = data.split("::");

            //If running a script, check if script is already running
            if (response.length > 1) {
                var filename = response[0],
                    path = response[1];
                script = require("child_process").exec(filename, {cwd: path},
                    function (error, stdout, stderr) {
                        console.log('stdout: ' + stdout);
                        console.log('stderr: ' + stderr);
                        if (error !== null) {
                            console.log('exec error: ' + error);
                        }
                    });

            }

        });

        redirectOutput(win_node.stdout);
        redirectOutput(win_node.stderr);
    }


    key("a", () => {
        console.log($localDemo.css("width"));
        if ($localDemo.css("width") === "0px") {
            $localDemo.removeClass("localDemoHide");
            var refreshDemo =  document.getElementById('localDemo');
            refreshDemo.reload(); //refresh the localhost view...
            $expressApp.addClass("expressAppHide");
        } else {
            $expressApp.removeClass("expressAppHide");
            $localDemo.addClass("localDemoHide");
        }
    });

    key("d", () => {
        //if we can't see localhost show local host
        if ($serverLog.css("display") === "none") {
            $serverLog.css("display", "block");
            $expressApp.addClass("expressAppHide");
        } else {
            $expressApp.removeClass("expressAppHide");
            $serverLog.css("display", "none");
        }
    });

    function strip(s) {
        // regex from: http://stackoverflow.com/a/29497680/170217
        return s.replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');
    }

    function redirectOutput(x) {
        let lineBuffer = "";

        x.on('data', function (data) {
            lineBuffer += data.toString();
            let lines = lineBuffer.split("\n");

            _.forEach(lines, (l) => {
                if (l !== "") {
                    $serverLog.append(strip(l) + "<br/>");
                }
            });

            lineBuffer = lines[lines.length - 1];
        });
    }


    let checkServerRunning = setInterval(() => {
        //check on the express application
        request(expressAppUrl, (error, response, body) => {
            if (!error && response.statusCode == 200) {
                $expressApp.attr("src", expressAppUrl);
                $loading.css("display", "none");
                $expressApp.css("display", "block");
                clearInterval(checkServerRunning);
            }

        });

    }, 1000);
</script>
</body>

</html>
